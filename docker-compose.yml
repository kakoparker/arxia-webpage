# ─────────────────────────────────────────────────────────────────────────────
# Server-side stack for www.arxia.com. Lives on the Arxia server (e.g. in
# /opt/arxia-webpage). The CD pipeline pushes a new image to GHCR and this
# compose just pulls + restarts. Caddy terminates TLS (auto Let's Encrypt) and
# reverse-proxies to the Next.js container.
#
# First run:   docker compose up -d
# Each deploy: docker compose pull && docker compose up -d   (the pipeline does this)
# See DEPLOYMENT.md.
# ─────────────────────────────────────────────────────────────────────────────

services:
  web:
    image: ghcr.io/kakoparker/arxia-webpage:latest
    restart: unless-stopped
    # Server-only secrets live in a `.env` file next to this compose file.
    # Copy .env.example → .env and fill in RESEND_API_KEY / RESEND_FROM.
    env_file:
      - .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/en"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
