name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Runs on every PR and every push to main. Vercel builds independently on its
  # own infrastructure (and blocks a broken deploy), but this keeps a visible
  # green/red build + typecheck gate in the repo regardless of the host.

# Least privilege: the job only reads the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Actions are pinned to full commit SHAs (tags can be moved).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
