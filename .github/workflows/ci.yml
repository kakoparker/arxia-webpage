name: CI

on:
  pull_request:
    branches: [main]
  # Pushes to main are validated by deploy.yml, which builds the production
  # Docker image (running `next build` inside) on every push — the same gate,
  # plus it proves the image itself builds. Keeping CI on PRs only avoids a
  # redundant second build on each main push.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
