name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Runs on every PR and every push to main. Vercel builds independently on its
  # own infrastructure (and blocks a broken deploy), but this keeps a visible
  # green/red build + typecheck gate in the repo regardless of the host.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
