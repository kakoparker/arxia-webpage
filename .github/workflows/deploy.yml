name: Deploy

# Continuous deployment to the self-hosted Arxia server.
#
# On every push to `main` the production Docker image is BUILT (this validates
# the Dockerfile + runs `next build` = the build gate). The image is only
# PUSHED to GHCR and DEPLOYED to the server when the `DEPLOY_ENABLED` repo
# variable is "true" — so the build is always exercised, but nothing reaches
# production until an engineer configures the server (see DEPLOYMENT.md).
#
# Required to activate (Settings → Secrets and variables → Actions):
#   Variables: DEPLOY_ENABLED=true, optional PLAUSIBLE_DOMAIN=arxia.com
#   Secrets:   SSH_HOST, SSH_USER, SSH_KEY  (private key with access to the server)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      ENABLED: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only needed when we actually publish the image.
      - name: Log in to GitHub Container Registry
        if: env.ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always BUILD (validates the Dockerfile + runs next build = build gate).
      # Only PUSH when deployment is enabled.
      - name: Build image (push when enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.ENABLED == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.PLAUSIBLE_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull the freshly published image on the server and restart. Keeps the
      # previous image around so a rollback is just re-tagging (see DEPLOYMENT.md).
      - name: Deploy on server over SSH
        if: env.ENABLED == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/arxia-webpage
            docker compose pull web
            docker compose up -d
            docker image prune -f
